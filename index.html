<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VHC Advisors - Vipul Healthcare Consulting</title>
    <meta name="description" content="VHC Advisors - Your Trusted Partner in Healthcare Staffing Solutions.">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for the logo */
        #logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #logo-svg {
            width: 150px;
            height: auto;
        }
        .logo-text {
            font-family: 'Open Sans', sans-serif;
            font-weight: 700;
            fill: #003366;
            font-size: 36px;
        }
        /* Custom CSS for animations and enhanced UI */
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .slide-in-left {
            animation: slideInLeft 0.8s ease-in-out;
        }
        @keyframes slideInLeft {
            from { transform: translateX(-50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .slide-in-right {
            animation: slideInRight 0.8s ease-in-out;
        }
        @keyframes slideInRight {
            from { transform: translateX(50px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .scale-up {
            transition: transform 0.3s ease-in-out;
        }
        .scale-up:hover {
            transform: scale(1.03);
        }
        .shadow-lg-teal {
            box-shadow: 0 4px 10px rgba(0, 128, 128, 0.3);
        }
        .shadow-lg-blue {
            box-shadow: 0 4px 10px rgba(0, 0, 200, 0.3);
        }
    </style>
</head>

                    <text x="75" y="85" text-anchor="middle" class="logo-text">VHC</text>
                </svg>
                <span class="ml-4 text-3xl font-semibold text-blue-900">Advisors</span>
            </div>
            <nav class="hidden md:block">

                    <li><a href="#services" class="text-blue-600 hover:text-teal-500 transition duration-300 font-semibold text-lg">Services</a></li>
